title: Felix Bötsch
description: >-
  Optimization Engineer and Applied Data Scientist working across energy systems,
  simulation, mathematical optimization, and industrial decision support.
url: "https://feboe.github.io"
baseurl: ""
repository: feboe/feboe.github.io
remote_theme: yousinix/portfolYOU@v2.3.0
open_new_tab: true

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project

author:
  name: Felix Bötsch
  github: feboe

analytics:
  enabled: false

buymeacoffee:
  enabled: false

exclude:
  - README.md
  - CONTRIBUTING.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - projects.md
  - "*.log"
