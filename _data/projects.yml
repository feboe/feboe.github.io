sections:
  - id: energy
    title: Energy Systems & Data
    intro: Energy forecasting, market analysis, and optimization grounded in real operating data.
    projects:
      - title: Smart Building Load Forecasting & Battery Optimization
        context: Personal Project
        featured: true
        takeaway: Real smart-building data yielded 8.21% forecast WAPE and showed when optimized battery dispatch adds value—and how strongly assumptions affect it.
        challenge: Use real measurements of building consumption, PV and CHP generation, grid import, and grid export to reconstruct a consistent energy balance, forecast 24-hour load, and evaluate battery-control strategies.
        approach:
          - Built a PostgreSQL workflow from Engel et al.’s real-world smart-company-building dataset on Dryad and German day-ahead prices from SMARD.
          - "Forecasting workstream: reconstructed building load and evaluated leakage-safe 24-hour forecasts against daily- and weekly-naive baselines using chronological validation."
          - "Battery workstream: compared heuristic dispatch with a physically constrained rolling-horizon linear program and tested battery capacity, hourly versus 15-minute resolution, terminal state-of-charge valuation, auxiliary consumption, and self-discharge."
        outcomes:
          - The Histogram Gradient Boosting model achieved 8.21% weighted absolute percentage error (WAPE) on the held-out 2021 period and outperformed both seasonal baselines.
          - "The building already self-consumed approximately 92% of local generation, limiting surplus-only storage value. Optimization added most value when dynamic prices and grid charging introduced timing decisions: €13.4k versus €9.4k simulated annual operating savings in the 1,000-kWh hourly reference case."
          - "Sensitivity experiments showed that estimated storage value is scenario-dependent: finer temporal resolution increased calculated savings, larger capacities produced diminishing marginal value, and auxiliary consumption materially reduced savings."
        note: Battery savings are scenario results, not investment returns. They are measured against corresponding no-battery baselines and exclude purchase, installation, financing, maintenance, replacement, and demand-charge costs.
        methods:
          - Python
          - PostgreSQL
          - Time-series forecasting
          - Histogram Gradient Boosting
          - Chronological validation
          - Battery simulation
          - Linear programming
          - PuLP
        repository: https://github.com/feboe/smart-building-energy-optimization
        repository_label: View project repository
        images:
          - src: /assets/images/projects/smart-building-battery-strategies.png
            alt: Bar chart comparing simulated annual operating savings across battery dispatch strategies for a 1,000 kWh system.
            caption: Initial hourly strategy comparison for a 1,000-kWh system; optimization gains are largest with dynamic prices and permitted grid charging.

      - title: Negative Day-Ahead Price Analysis
        context: Personal Project
        takeaway: Negative price hours grew from 2022–2025, clustering around spring and summer middays rather than becoming substantially longer events.
        challenge: Determine when negative electricity prices occur in the German–Luxembourg bidding zone and which system and calendar conditions are associated with them.
        approach:
          - Built a Python and PostgreSQL pipeline for SMARD price, demand, wind, solar, and calendar data from 2022–2025.
          - Created Structured Query Language (SQL) quality and analysis views for residual load, negative-price hours, event duration, price intensity, and calendar patterns.
          - Documented the limits of the exploratory analysis, including simplified residual load and changes in market time resolution.
        outcomes:
          - Negative-price hours increased across 2022–2025 and concentrated around midday, particularly in spring and summer.
          - Shares were higher on weekends and holidays and associated with low forecast residual load, though residual load did not explain every event.
          - Most continuous events lasted one to eight hours; the median rose only from 4.5 to 5.5 hours, indicating more frequent rather than much longer events.
        methods:
          - Python
          - SQL
          - PostgreSQL
          - ETL
          - Time-series analysis
          - Energy-market data
        repository: https://github.com/feboe/energy-data-sql-pipeline
        repository_label: View project repository
        images:
          - src: /assets/images/projects/negative-price-patterns.png
            alt: Heatmap showing negative day-ahead price hours by month and local hour of day.
            caption: Negative-price hours in the German–Luxembourg bidding zone, 2022–2025; events concentrate around spring and summer middays.

  - id: optimization
    title: Optimization & Simulation
    intro: Constraint-based models and simulation environments for complex engineering operations.
    projects:
      - title: Reinforcement-Learning Paint Scheduling Optimization
        context: Master Thesis & Professional Project
        takeaway: The modeled prototype reduced solvent consumption by 2.92% versus the heuristic while increasing simulated process duration by 0.24%.
        challenge: Sequence color-assigned parts through an industrial paint process to reduce solvent-intensive color changes while also limiting idle time.
        approach:
          - Modeled the process as a Gymnasium-compatible simulation environment and implemented single- and multi-agent reinforcement-learning prototypes with deep Q-networks (DQN) and Ray RLlib.
          - Applied action masking to enforce feasible decisions and reduce avoidable standstill periods.
          - Reimplemented the existing heuristic in Python and validated the simulation against reference production data.
        outcomes:
          - The prototype reduced modeled solvent consumption by 2.92% relative to the heuristic reference.
          - The reinforcement-learning policy increased average process duration by 0.24% relative to the heuristic benchmark, measured in time steps within the simulation environment.
        methods:
          - Python
          - Reinforcement learning
          - DQN
          - Ray RLlib
          - Simulation
          - Action masking

      - title: Thermal Motor Model Parameterization
        context: Bachelor Thesis & Professional Project
        takeaway: A MATLAB parameterization workflow entered active development use and established a documented best-practice basis.
        challenge: Develop a robust and traceable workflow for parameterizing an electric-motor thermal model from measurement data.
        approach:
          - Developed a MATLAB calculation tool around a time-discrete thermal simulation solved with the explicit Euler method.
          - Used weighted regression, multiple starting values, and a structured data-preparation workflow to improve parameter robustness.
          - Connected the tool to the existing data-processing application and documented a repeatable parameterization procedure.
        outcomes:
          - The MATLAB tool connected to the existing data-processing application and entered active development use.
          - The documented workflow provided a repeatable best-practice basis for thermal-model parameterization.
        methods:
          - MATLAB
          - Thermal simulation
          - Explicit Euler method
          - Weighted regression
          - Parameter estimation

      - title: Industrial Coating System Optimization
        context: Professional Project
        takeaway: An early prototype reproduced results comparable to the legacy planner and demonstrated a flexible modeling basis for future planning studies.
        challenge: Replace a legacy planning tool for a multi-stage dip-coating system in which carriers must satisfy different dwell times without crossing or blocking one another.
        approach:
          - Translated equipment behavior, dwell-time requirements, carrier logic, and collision avoidance into a simulation and optimization model.
          - Used Differential Evolution to search for efficient movement strategies and compared results with the existing planning tool.
          - Added graphical carrier-path visualization to make candidate schedules reviewable by engineers.
        outcomes:
          - Delivered an early-stage prototype with results comparable to the previous planning tool before the wider project was paused.
          - Added graphical carrier-path views so engineers could review candidate schedules.
          - Established a basis for future cycle-time studies, carrier sizing, and optimization analysis.
        methods:
          - Python
          - Simulation
          - Differential Evolution
          - Constraint modeling
          - Engineering visualization

  - id: decision-support
    title: Data-Driven Engineering & Decision Support
    intro: Production-data systems that turn measurements and engineering rules into repeatable decisions.
    projects:
      - title: Quality Specification Optimization & Backtesting
        context: Professional Project
        takeaway: A production evaluation workflow combined backtesting and optimization to support a specification change before its production introduction.
        challenge: Assess how numerical quality specifications affect reject and rework outcomes, identify which specifications have the strongest influence, and refactor the existing evaluation codebase.
        approach:
          - Refactored the evaluation backend into modular, object-oriented components.
          - Added historical what-if backtesting to compare candidate specification sets before applying changes in production.
          - Analyzed individual specification effects and used Differential Evolution to explore parameter combinations for a defined reject-rate target.
          - Added automated PDF reporting and rework evaluation based on defect types and time limits.
        outcomes:
          - Delivered a refactored evaluation process that ran in production with a more modular, object-oriented backend.
          - Added comparison, optimization, and automated reporting tools for repeatable specification analysis and data-based rework decisions.
          - The workflow evaluated and supported one specification change before its introduction into production.
        methods:
          - Python
          - Backtesting
          - Differential Evolution
          - Object-oriented design
          - PyLaTeX
          - Decision support

      - title: 3D Inspection Coverage Projection
        context: Professional Project
        takeaway: A stable production backend replaced manual coverage marking with repeatable 3D projection and interactive review.
        challenge: Replace manual marking of inspection coverage with a reproducible digital projection of image data onto component geometry.
        approach:
          - Implemented and compared a 2D-to-3D regressor and a raycasting-based projection for mapping image data onto component geometry.
          - Visualized projected coverage with Open3D and integrated reusable backend components with an interactive Streamlit frontend.
        outcomes:
          - The projection backend entered stable use in the production workflow.
          - Replaced manual marking with a repeatable digital coverage-projection workflow.
          - Allowed users to switch between raycasting and regression-based visualizations.
        methods:
          - Python
          - Raycasting
          - 2D–3D regression
          - Open3D
          - Streamlit

      - title: Defect Measurement Method Validation
        context: Professional Project
        takeaway: Method validation delivered a preferred defect-measurement method and decision logic for normal and edge-case use.
        challenge: Determine which defect-measurement method performs reliably across normal conditions and edge cases.
        approach:
          - Built controlled test pieces with simulated defects of different sizes on components.
          - Compared 2D-to-3D regression, raycasting, and existing internal measurement methods.
          - Developed Streamlit analysis tools to visualize results, defect geometry, and special cases.
          - Documented method strengths, weaknesses, and selection logic for different use cases.
        outcomes:
          - Established a preferred measurement method for future defect measurement.
          - Produced reusable Streamlit tools for geometry analysis and method comparison.
          - Documented decision logic for normal cases and edge conditions.
        methods:
          - Python
          - Raycasting
          - 2D–3D regression
          - Streamlit
          - Method validation

      - title: Production Data Anomaly Detection
        context: Professional Project
        takeaway: Reusable monitoring tools surfaced candidate production anomalies for engineering review; live-operation validation remained necessary before rollout.
        challenge: Identify unusual patterns in production and defect data without pre-existing labels marking known issue periods.
        approach:
          - Implemented a transparent statistical detection method using z-scores around moving averages with dynamic upper and lower thresholds.
          - Analyzed individual components, batches, and defect categories at different aggregation levels.
          - Created 2D trend views, 3D defect-location visualizations, and Streamlit applications for exploratory analysis.
        outcomes:
          - Produced a reusable monitoring backend and exploratory views that surfaced candidate anomalies for engineering review.
          - Supported analysis by component, batch, defect category, and aggregation level.
          - Live-operation validation and trigger calibration remained necessary before operational rollout.
        methods:
          - Python
          - Statistical anomaly detection
          - Moving statistics
          - Production analytics
          - Streamlit
          - 3D visualization

  - id: additional
    title: Additional Projects
    intro: Smaller portfolio projects demonstrating adjacent optimization and applied machine-learning capabilities.
    compact: true
    projects:
      - title: SLA-Aware Ticket Assignment
        context: Personal Project
        takeaway: A reproducible scheduler exposes the trade-offs between simple dispatch rules and rolling constraint optimization for urgent tickets.
        challenge: Assign queued tickets under capacity, language, priority, and service-level-agreement (SLA) constraints without protecting urgent work at the expense of overall throughput.
        approach:
          - Compared heuristic dispatch policies with an OR-Tools constraint-programming scheduler that replans as queue conditions change.
          - Evaluated throughput, waiting time, and protection of SLA-critical tickets.
        outcomes:
          - Delivered a reproducible prototype comparing heuristic dispatch with rolling constraint optimization.
          - Made trade-offs between throughput, waiting time, and protection of SLA-critical tickets visible.
        methods:
          - Python
          - OR-Tools
          - CP-SAT
          - Rolling-horizon scheduling
        repository: https://github.com/feboe/sla-aware-ticket-assignment
        repository_label: View repository

      - title: Ticket Routing & Priority Prediction Service
        context: Personal Project
        takeaway: A working reference service demonstrates multilingual ticket triage and reproducible model delivery from training through a usable interface.
        challenge: Turn multilingual support-ticket classification into a reproducible end-to-end machine-learning service rather than an isolated model experiment.
        approach:
          - Built a scikit-learn text-classification workflow with tracked experiments, an application programming interface (API), and a lightweight demonstration interface.
          - Separated training, inference, service, and user interface components in a containerized setup.
        outcomes:
          - Delivered a working reference service for multilingual ticket triage.
          - Separated training, inference, service, and user interface components in a reproducible containerized setup.
        methods:
          - Python
          - scikit-learn
          - MLflow
          - FastAPI
          - Streamlit
          - Docker
        repository: https://github.com/feboe/ticket-priority-ml-service
        repository_label: View repository
