{% assign project = include.project %}
<article class="project-overview-card">
  <a class="project-overview-link" href="{{ project.url | relative_url }}">
    <div>
      <p class="project-context">{{ project.context }}</p>
      <h3>{{ project.title }}</h3>
      <p class="project-card-summary">{{ project.card_summary }}</p>
    </div>

    <div class="project-overview-footer">
      <ul class="method-list" aria-label="Project focus areas">
        {% for item in project.focus limit: 3 %}<li>{{ item }}</li>{% endfor %}
      </ul>
      <span class="project-detail-link">View project details <span aria-hidden="true">→</span></span>
    </div>
  </a>
</article>
